<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard VGV – Universo de Planetas</title>

  <!-- CSS de estilo planetário -->
  <style>
    /* Fundo do “universo” */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 50% 20%, #0b1d3a, #001020);
      color: #e0eaff;
      min-height: 100vh;
    }

    h1, h2 {
      text-align: center;
      color: #ffdd55;
      margin: 0.5rem 0;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 1rem;
    }

    /* Cards “planeta” */
    .planet-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      position: relative;
    }

    .planet-card::before {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 12px;
      background: linear-gradient(135deg,
        rgba(255,221,85,0.2),
        rgba(0,255,255,0.2),
        rgba(255,0,200,0.2));
      opacity: 0.4;
      z-index: -1;
      animation: rotate 30s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }

    th, td {
      padding: 0.5rem;
      border: 1px solid rgba(255,255,255,0.2);
      text-align: left;
    }

    th {
      background: rgba(255,255,255,0.1);
    }

    /* Área dos gráficos */
    .chart-container {
      position: relative;
      height: 400px;
      margin-top: 1rem;
    }
  </style>

  <!-- Bibliotecas externas -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
  <h1>📊 Dashboard VGV – Universo de Planetas</h1>

  <div class="container">

    <!-- PROMOTOR -->
    <section class="planet-card" id="promotor-section">
      <h2>🔭 VGV – Promotor</h2>
      <div id="promotor-table"></div>
      <canvas id="promotor-chart" class="chart-container"></canvas>
    </section>

    <!-- CONSULTOR -->
    <section class="planet-card" id="consultor-section">
      <h2>🪐 VGV – Consultor</h2>
      <div id="consultor-table"></div>
      <canvas id="consultor-chart" class="chart-container"></canvas>
    </section>

    <!-- CLOSER -->
    <section class="planet-card" id="closer-section">
      <h2>🌑 VGV – Closer</h2>
      <div id="closer-table"></div>
      <canvas id="closer-chart" class="chart-container"></canvas>
    </section>

  </div>

  <!-- Script de carregamento e visualização -->
  <script>
    // Função genérica para criar tabela HTML a partir de dados CSV
    function createTable(containerId, data) {
      const container = document.getElementById(containerId);
      if (!data || data.length === 0) {
        container.innerHTML = '<p>Sem dados.</p>';
        return;
      }

      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const tbody = document.createElement('tbody');

      // Cabeçalho
      const headerRow = document.createElement('tr');
      data[0].forEach(col => {
        const th = document.createElement('th');
        th.textContent = col;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      // Linhas
      data.slice(1).forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(cell => {
          const td = document.createElement('td');
          td.textContent = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      table.appendChild(thead);
      table.appendChild(tbody);
      container.innerHTML = '';
      container.appendChild(table);
    }

    // Função para gerar gráfico de barras (VGV por mês, por exemplo)
    function createBarChart(canvasId, labels, values, title) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: title,
            data: values,
            backgroundColor: 'rgba(255,221,85,0.6)',
            borderColor: 'rgba(255,221,85,1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            title: {
              display: true,
              text: title,
              color: '#ffdd55',
              font: { size: 16 }
            }
          },
          scales: {
            x: { ticks: { color: '#e0eaff' } },
            y: { ticks: { color: '#e0eaff' }, beginAtZero: true }
          }
        }
      });
    }

    // Carrega CSVs e gera tabelas + gráficos
    function loadCSV(path, tableDivId, chartId, chartTitle) {
      Papa.parse(path, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
          const data = results.data;
          createTable(tableDivId, data);

          // Exemplo de agregação: somar VGV (coluna 2) por mês (coluna 1)
          const map = new Map(); // mês → soma
          for (let i = 1; i < data.length; i++) {
            const row = data[i];
            const month = row[0];
            const vgv = parseFloat(row[1].replace(/[^\d.-]/g, '')) || 0;
            map.set(month, (map.get(month) || 0) + vgv);
          }
          const labels = Array.from(map.keys());
          const values = Array.from(map.values());

          createBarChart(chartId, labels, values, chartTitle);
        },
        error: function(err) {
          console.error('Erro ao ler', path, err);
          document.getElementById(tableDivId).innerHTML = '<p>Erro ao carregar dados.</p>';
        }
      });
    }

    // ---- INICIALIZAÇÃO ----
    loadCSV('vgv_promotor.csv', 'promotor-table', 'promotor-chart', 'VGV – Promotor (por mês)');
    loadCSV('vgv_consultor.csv', 'consultor-table', 'consultor-chart', 'VGV – Consultor (por mês)');
    loadCSV('vgv_closer.csv',   'closer-table',   'closer-chart',   'VGV – Closer (por mês)');
  </script>
</body>
</html>
