<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel de Atendimentos</title>
  <meta name="color-scheme" content="dark light" />
  <style>
    :root{
      --bg0:#070A12;
      --bg1:#0B1222;
      --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.12);
      --text:#EAF0FF;
      --muted: rgba(234,240,255,.72);
      --good:#5CFFB0;
      --warn:#FFDF6C;
      --bad:#FF6B8B;
      --accent:#7C5CFF;
      --accent2:#22D3EE;
      --shadow: 0 20px 60px rgba(0,0,0,.55);
      --radius: 18px;
      --radius2: 12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 10% 10%, rgba(124,92,255,.25), transparent 55%),
        radial-gradient(900px 600px at 90% 20%, rgba(34,211,238,.18), transparent 55%),
        radial-gradient(800px 600px at 40% 90%, rgba(92,255,176,.12), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }
    a{color:inherit}
    .wrap{max-width:1400px; margin:0 auto; padding:28px 16px 60px}
    header{
      display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
      padding:18px 18px;
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    h1{margin:0; font-size:20px; letter-spacing:.2px}
    .sub{margin:6px 0 0; color:var(--muted); font-size:13px}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 10px;
      border-radius: 999px;
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.18);
      font-family: var(--mono);
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:14px;
      margin-top:14px;
    }
    .card{
      grid-column: span 12;
      padding:16px;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .kpis{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:12px;
    }
    @media (min-width: 640px){
      .kpis{grid-template-columns: repeat(3, 1fr);}
    }
    @media (min-width: 900px){
      .kpis{grid-template-columns: repeat(4, 1fr);}
    }
    @media (min-width: 1200px){
      .kpis{grid-template-columns: repeat(7, 1fr);}
    }
    .kpi{
      padding:14px;
      border-radius: var(--radius2);
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.15);
      min-height:84px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .kpi .label{font-size:11px;color:var(--muted);line-height:1.3;margin-bottom:8px}
    .kpi .value{font-size:16px;font-weight:700;letter-spacing:.2px;flex-grow:1;display:flex;align-items:center}
    @media (min-width: 640px){
      .kpi .label{font-size:12px}
      .kpi .value{font-size:18px}
    }
    @media (min-width: 1024px){
      .kpi .value{font-size:20px}
    }
    .kpi .hint{margin-top:6px;font-size:10px;color:var(--muted);opacity:.7}

    .filters .row{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:10px;
      align-items:end;
    }
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input{
      width:100%;
      padding:10px 10px;
      border-radius: 12px;
      border:1px solid var(--stroke);
      background: rgba(10,12,20,.55);
      color: var(--text);
      outline:none;
    }
    input::placeholder{color: rgba(234,240,255,.42)}
    .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    button{
      padding:10px 12px;
      border-radius: 12px;
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(124,92,255,.25), rgba(124,92,255,.10));
      color: var(--text);
      cursor:pointer;
    }
    button.secondary{background: rgba(0,0,0,.18)}
    .err{
      margin-top:12px;
      padding:12px 14px;
      border-radius: 14px;
      border:1px solid rgba(255,107,139,.35);
      background: rgba(255,107,139,.10);
      color: rgba(255,220,230,.95);
      display:none;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Painel de Atendimentos (CSV)</h1>
        <div class="sub">Leitura de <span class="pill" id="csvPath">dados.csv</span> via GitHub Pages (sem backend).</div>
      </div>
      <div class="pill" id="statusPill">Carregando…</div>
    </header>

    <div class="grid">
      <section class="card">
        <div class="kpis" id="kpis"></div>
      </section>

      <section class="card filters">
        <div class="row">
          <div>
            <label>Período (início)</label>
            <input id="dtIni" placeholder="dd/mm/aaaa" />
          </div>
          <div>
            <label>Período (fim)</label>
            <input id="dtFim" placeholder="dd/mm/aaaa" />
          </div>
        </div>

        <div class="btns">
          <button id="btnAplicar">Aplicar filtros</button>
          <button class="secondary" id="btnLimpar">Limpar</button>
        </div>

        <div class="err" id="errBox"></div>
      </section>
    </div>
  </div>

<script>
  const CSV_URL = "./dados.csv";

  const el = (id) => document.getElementById(id);

  const state = {
    rows: [],
    filtered: []
  };

  function showError(msg){
    const box = el("errBox");
    box.style.display = "block";
    box.textContent = msg;
  }
  function clearError(){
    const box = el("errBox");
    box.style.display = "none";
    box.textContent = "";
  }

  function stripBOM(s){
    if (!s) return s;
    return s.replace(/^\uFEFF/, "");
  }
  function normalizeHeader(h){
    return stripBOM(String(h ?? "")).trim().toLowerCase();
  }

  function parseBRDate(str){
    if (!str) return null;
    const s = String(str).trim();
    const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return null;
    const d = Number(m[1]), mo = Number(m[2]) - 1, y = Number(m[3]);
    const dt = new Date(y, mo, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo || dt.getDate() !== d) return null;
    return dt;
  }

  function parseMoneyBR(value){
    if (value == null) return 0;
    let s = String(value).trim();
    if (!s) return 0;

    s = s.replace(/\s/g, "").replace(/^R\$/i, "");

    if (s.includes(",")){
      s = s.replace(/\./g, "").replace(",", ".");
    } else {
      s = s.replace(/\./g, "");
    }

    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  }
  function formatMoneyBR(n){
    return (n || 0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
  }
  function formatPercent(n){
    return (n || 0).toLocaleString("pt-BR", {
      style:"percent",
      minimumFractionDigits:1,
      maximumFractionDigits:1
    });
  }
  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function parseCSV(text, delimiter=";"){
    const rows = [];
    let i=0, field="", row=[], inQuotes=false;

    while (i < text.length){
      const c = text[i];

      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if (c === '"'){ inQuotes = true; i++; continue; }
        if (c === delimiter){ row.push(field); field=""; i++; continue; }
        if (c === "\n"){ row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
        if (c === "\r"){ i++; continue; }
        field += c; i++; continue;
      }
    }
    row.push(field);
    if (row.length > 1 || (row.length === 1 && row[0].trim() !== "")) rows.push(row);
    return rows;
  }

  function buildObjects(csvText){
    const matrix = parseCSV(csvText, ";");
    if (!matrix.length) return [];

    const headersRaw = matrix[0];
    const headers = headersRaw.map(normalizeHeader);

    const iData = headers.indexOf("data");
    if (iData === -1){
      throw new Error(`Cabeçalho "data" não encontrado. Cabeçalhos lidos: ${headersRaw.join(" | ")}`);
    }

    const rows = [];
    for (let r = 1; r < matrix.length; r++){
      const line = matrix[r];
      const obj = {};
      for (let c = 0; c < headers.length; c++){
        const key = headers[c] || `col_${c}`;
        obj[key] = (line[c] ?? "").trim();
      }
      obj._date = parseBRDate(obj["data"]);
      obj._valor = parseMoneyBR(obj["valor vendido"]);
      rows.push(obj);
    }
    return rows;
  }

  function splitStatusList(statusString){
    if (!statusString || String(statusString).trim() === "") return [];
    return String(statusString)
      .split("#")
      .map(s => s.trim().toUpperCase())
      .filter(Boolean);
  }

  function countInStatus(statusString, wanted){
    const list = splitStatusList(statusString);
    const w = String(wanted).trim().toUpperCase();
    return list.filter(x => x === w).length;
  }

  function computeKPIs(rows){
    const casais = rows.length;

    const somaValor = rows.reduce((acc, row) => acc + (row._valor || 0), 0);

    // CANCELADO conta como venda também
    // Cotas vendidas = ATIVO + CANCELADO (somando todas as ocorrências)
    let cotasVendidas = 0;
    let cotasAtivas = 0;
    let cotasCanceladas = 0;

    for (const row of rows){
      const s = row["status do contrato"];
      const ativos = countInStatus(s, "ATIVO");
      const cancelados = countInStatus(s, "CANCELADO");
      cotasAtivas += ativos;
      cotasCanceladas += cancelados;
      cotasVendidas += (ativos + cancelados);
    }

    // Cancelamentos = cotas canceladas
    const cancelamentos = cotasCanceladas;

    // Casais atendidos = status do contrato preenchido e diferente de NOTOUR
    const casaisAtendidos = rows.filter(row => {
      const v = (row["status do contrato"] ?? "").trim().toUpperCase();
      return v !== "" && v !== "NOTOUR";
    }).length;

    // % cancelamento (cotas canceladas / cotas vendidas)
    const pctCancel = cotasVendidas > 0 ? (cancelamentos / cotasVendidas) : 0;

    // Eficiência (cotas vendidas / casais atendidos)
    const eficiencia = casaisAtendidos > 0 ? (cotasVendidas / casaisAtendidos) : 0;

    // Renda média por casal
    const rendaMedia = casais > 0 ? (somaValor / casais) : 0;

    return {
      casais,
      somaValor,
      cotasVendidas,
      cotasAtivas,
      cotasCanceladas,
      cancelamentos,
      pctCancel,
      eficiencia,
      rendaMedia
    };
  }

  function renderKPIs(){
    const k = computeKPIs(state.filtered);

    const kpiCards = [
      { label: "Casais", value: k.casais.toLocaleString("pt-BR"), hint: "Total de registros" },
      { label: "Cotas vendidas", value: k.cotasVendidas.toLocaleString("pt-BR"), hint: "ATIVO + CANCELADO" },
      { label: "Valor vendido", value: formatMoneyBR(k.somaValor), hint: "Soma total" },
      { label: "Eficiência", value: formatPercent(k.eficiencia), hint: "Cotas / casais atendidos" },
      { label: "Cancelamentos", value: k.cancelamentos.toLocaleString("pt-BR"), hint: "Qtd. de CANCELADO" },
      { label: "% Cancelamento", value: formatPercent(k.pctCancel), hint: "Canceladas / vendidas" },
      { label: "Renda média", value: formatMoneyBR(k.rendaMedia), hint: "Valor médio por casal" }
    ];

    el("kpis").innerHTML = kpiCards.map(x => `
      <div class="kpi">
        <div class="label">${escapeHtml(x.label)}</div>
        <div class="value">${escapeHtml(x.value)}</div>
        <div class="hint">${escapeHtml(x.hint)}</div>
      </div>
    `).join("");
  }

  function renderAll(){
    renderKPIs();
    el("statusPill").textContent = `OK • ${state.filtered.length.toLocaleString("pt-BR")} casais`;
  }

  function applyFilters(){
    clearError();
    const ini = parseBRDate(el("dtIni").value.trim());
    const fim = parseBRDate(el("dtFim").value.trim());

    const out = state.rows.filter(o => {
      if (ini && (!o._date || o._date < ini)) return false;
      if (fim && (!o._date || o._date > fim)) return false;
      return true;
    });

    state.filtered = out;
    renderAll();
  }

  async function init(){
    el("csvPath").textContent = CSV_URL;

    try{
      el("statusPill").textContent = "Baixando CSV…";
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`Falha ao carregar ${CSV_URL} (HTTP ${res.status}).`);

      el("statusPill").textContent = "Processando…";
      const text = await res.text();
      const rows = buildObjects(text);

      state.rows = rows;
      state.filtered = rows;

      const dates = rows.map(o => o._date).filter(Boolean).sort((a,b)=>a-b);
      if (dates.length){
        const pad = (n)=> String(n).padStart(2,"0");
        const fmt = (d)=> `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
        el("dtIni").value = fmt(dates[0]);
        el("dtFim").value = fmt(dates[dates.length-1]);
      }

      renderAll();
    }catch(err){
      el("statusPill").textContent = "Erro";
      showError(String(err && err.message ? err.message : err));
    }
  }

  el("btnAplicar").addEventListener("click", applyFilters);
  el("btnLimpar").addEventListener("click", () => {
    el("dtIni").value = "";
    el("dtFim").value = "";
    state.filtered = state.rows;
    renderAll();
  });

  init();
</script>
</body>
</html>
