<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard (GitHub Pages)</title>
  <style>
    :root{
      --bg1:#0b1020; --bg2:#0b2a2d;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.09);
      --stroke: rgba(255,255,255,.14);
      --txt: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --brand:#8b5cf6;
      --brand2:#22c55e;
      --warn:#f59e0b;
      --bad:#fb7185;
      --good:#34d399;
      --shadow: 0 20px 70px rgba(0,0,0,.45);
      --radius: 18px;
      --radius2: 12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--txt);
      background: radial-gradient(1200px 700px at 10% 10%, rgba(139,92,246,.35), transparent 60%),
                  radial-gradient(1200px 700px at 90% 80%, rgba(34,197,94,.18), transparent 55%),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height:100vh;
    }
    a{ color:inherit; }
    .wrap{
      max-width: 1400px; margin: 0 auto; padding: 18px 18px 44px;
    }
    .topbar{
      display:flex; gap:14px; align-items:center; justify-content:space-between;
      margin-bottom:14px;
      padding:14px 16px;
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow: var(--shadow);
    }
    .title{
      display:flex; flex-direction:column; gap:4px;
    }
    .title h1{
      margin:0; font-size:18px; letter-spacing:.2px;
    }
    small{ color:var(--muted); }
    .top-actions{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      border:1px solid var(--stroke);
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      font-size: 13px;
    }
    .btn{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color: var(--txt);
      padding:10px 12px;
      border-radius: 999px;
      cursor:pointer;
      transition: .15s ease;
      font-weight:600;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.09); }
    .btn.primary{
      border-color: rgba(139,92,246,.55);
      background: linear-gradient(135deg, rgba(139,92,246,.45), rgba(139,92,246,.2));
    }
    .btn.good{
      border-color: rgba(34,197,94,.55);
      background: linear-gradient(135deg, rgba(34,197,94,.35), rgba(34,197,94,.14));
    }
    .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
    .file{
      display:flex; align-items:center; gap:10px;
      padding:10px 12px;
      border:1px dashed rgba(255,255,255,.28);
      border-radius: 999px;
      background: rgba(0,0,0,.12);
    }
    input[type="file"]{ color: var(--muted); }
    .tabs{
      display:flex; gap:10px; flex-wrap:wrap;
      margin: 14px 0;
    }
    .tab{
      padding:10px 14px;
      border-radius: 999px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      cursor:pointer;
      font-weight:700;
      user-select:none;
    }
    .tab.active{
      color: var(--txt);
      border-color: rgba(139,92,246,.6);
      background:rgba(139,92,246,.18);
    }
    .panel{
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.03));
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panel .inner{ padding:16px; }
    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }
    .card{
      grid-column: span 3;
      border: 1px solid var(--stroke);
      border-radius: var(--radius2);
      background: rgba(255,255,255,.05);
      padding: 14px;
      min-height: 92px;
    }
    .card h3{ margin:0 0 8px; font-size: 12px; color: var(--muted); font-weight:700; letter-spacing:.3px; text-transform:uppercase;}
    .card .big{ font-size: 22px; font-weight: 900; }
    .card .sub{ margin-top:6px; color: var(--muted); font-size: 12px; }
    .filters{
      display:grid;
      grid-template-columns: 1.2fr 1.2fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .field{
      border:1px solid var(--stroke);
      border-radius: var(--radius2);
      background: rgba(0,0,0,.14);
      padding: 10px 12px;
    }
    .field label{
      display:block; font-size:12px; color: var(--muted); margin-bottom:6px; font-weight:700;
    }
    .field input, .field select{
      width:100%;
      background: rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      padding: 10px 10px;
      color: var(--txt);
    }
    .field input::placeholder{ color: rgba(255,255,255,.35); }
    .filter-actions{ display:flex; gap:10px; margin-top: 10px; flex-wrap:wrap; }
    .legend{
      display:flex; gap:10px; flex-wrap:wrap;
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
    }
    .tag{
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.04);
    }
    .tag.good{ border-color: rgba(52,211,153,.5); background: rgba(52,211,153,.12); color: rgba(167,243,208,.95); }
    .tag.warn{ border-color: rgba(245,158,11,.55); background: rgba(245,158,11,.12); color: rgba(253,230,138,.95); }
    .tag.bad{ border-color: rgba(251,113,133,.55); background: rgba(251,113,133,.12); color: rgba(254,202,202,.95); }

    .tableWrap{
      overflow:auto;
      border:1px solid var(--stroke);
      border-radius: var(--radius2);
      background: rgba(0,0,0,.16);
    }
    table{
      width:100%;
      border-collapse: collapse;
      min-width: 920px;
      font-size: 13px;
    }
    th, td{
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      text-align:left;
      white-space: nowrap;
    }
    th{
      position:sticky; top:0;
      background: rgba(10,16,32,.88);
      backdrop-filter: blur(8px);
      z-index: 2;
      color: rgba(255,255,255,.86);
      font-weight:900;
      user-select:none;
    }
    th[data-sort]{ cursor:pointer; }
    th[data-sort]::after{ content:" ⇅"; opacity:.45; font-weight:900; margin-left:6px; }
    th.asc::after{ content:" ↑"; opacity:1; color: rgba(167,139,250,.95); }
    th.desc::after{ content:" ↓"; opacity:1; color: rgba(167,139,250,.95); }
    tr:hover td{ background: rgba(255,255,255,.03); }
    .muted{ color: var(--muted); }
    .right{ text-align:right; }
    .mono{ font-family: var(--mono); }
    .hide{ display:none !important; }

    @media (max-width: 980px){
      .filters{ grid-template-columns: 1fr 1fr; }
      .card{ grid-column: span 6; }
      table{ min-width: 860px; }
    }
    @media (max-width: 560px){
      .card{ grid-column: span 12; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">
      <h1>Leitura de <span class="mono">./dados.csv</span> via GitHub Pages</h1>
      <small id="statusLine" class="muted">Carregando…</small>
    </div>
    <div class="top-actions">
      <div class="pill" id="rowsPill">Registros: <b id="rowsCount">0</b></div>
      <div class="file">
        <input id="fileInput" type="file" accept=".csv,text/csv" />
      </div>
      <button class="btn good" id="reloadBtn" type="button">Recarregar dados</button>
      <button class="btn primary" id="applyBtn" type="button">Aplicar filtros</button>
      <button class="btn" id="clearBtn" type="button">Limpar</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="resumo">Resumo</div>
    <div class="tab" data-tab="ranking">Ranking</div>
    <div class="tab" data-tab="profissionais">Profissionais (ativo/inativo)</div>
    <div class="tab" data-tab="renda">Resultado por renda</div>
  </div>
  <div class="panel">
    <div class="inner">
      <div class="filters">
        <div class="field">
          <label>Dimensão</label>
          <select id="dimensaoSelect">
            <option value="consultor">Consultor</option>
            <option value="liner">Liner</option>
            <option value="closer">Closer</option>
            <option value="todos" selected>Todos</option>
          </select>
        </div>
        <div class="field">
          <label>Busca (nome contém)</label>
          <input id="buscaInput" placeholder="Ex.: JOÃO" />
        </div>
        <div class="field">
          <label>Somente ativos?</label>
          <select id="ativosSelect">
            <option value="sim" selected>Sim</option>
            <option value="nao">Não</option>
          </select>
        </div>
        <div class="field">
          <label>Período (início)</label>
          <input id="dataIni" type="date" />
        </div>
        <div class="field">
          <label>Período (fim)</label>
          <input id="dataFim" type="date" />
        </div>
        <div class="field">
          <label>Coluna de data (auto)</label>
          <input id="dateColHint" placeholder="(detectado automaticamente)" disabled />
        </div>
        <div class="field">
          <label>Coluna de status (auto)</label>
          <input id="statusColHint" placeholder="(detectado automaticamente)" disabled />
        </div>
        <div class="field">
          <label>Coluna de colaborador (auto)</label>
          <input id="colabColHint" placeholder="(detectado automaticamente)" disabled />
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn primary" id="applyBtn2" type="button">Aplicar filtros</button>
        <button class="btn" id="clearBtn2" type="button">Limpar</button>
      </div>
      <div class="legend">
        <span class="muted">Eficiência:</span>
        <span class="tag good">&ge; 25%</span>
        <span class="tag warn">20% a 24,9%</span>
        <span class="tag bad">&lt; 20%</span>
      </div>
    </div>
  </div>

  <!-- Resumo -->
  <section id="tab-resumo" class="panel">
    <div class="inner"><div class="grid" id="resumoCards"></div></div>
  </section>
  <!-- Ranking (sem filtro de dimensão) -->
  <section id="tab-ranking" class="panel hide">
    <div class="inner"><div class="tableWrap" id="rankingTable"></div></div>
  </section>
  <!-- Profissionais -->
  <section id="tab-profissionais" class="panel hide">
    <div class="inner"><div class="tableWrap" id="profTable"></div></div>
  </section>
  <!-- Resultado por renda -->
  <section id="tab-renda" class="panel hide">
    <div class="inner">
      <div class="grid" id="rendaCards"></div>
      <div style="height:12px"></div>
      <div class="tableWrap" id="rendaTable"></div>
    </div>
  </section>
</div>

<script>
  // =========================
  // Utilitários
  // =========================
  function normStr(v){
    return String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
  }
  function parseNumberBR(v){
    if (typeof v==='number') return v;
    const s=String(v??'').trim();
    if (!s) return 0;
    const c=s.replace(/[R$\s]/g,'').replace(/\./g,'').replace(',', '.');
    const n=Number(c);
    return Number.isFinite(n)? n : 0;
  }
  function toBRL(n){ return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function toPct(n){ return Number(n||0).toFixed(1)+'%'; }
  function parseDateLoose(s){
    const str=String(s??'').trim(); if (!str) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(str)){ const d=new Date(str+'T00:00:00'); return isNaN(d.getTime())?null:d; }
    const m1=str.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (m1){ const [_, dd, mm, yyyy]=m1; const d=new Date(`${yyyy}-${mm}-${dd}T00:00:00`); return isNaN(d.getTime())?null:d; }
    const m2=str.match(/^(\d{2})-(\d{2})-(\d{4})$/);
    if (m2){ const [_, dd, mm, yyyy]=m2; const d=new Date(`${yyyy}-${mm}-${dd}T00:00:00`); return isNaN(d.getTime())?null:d; }
    const d=new Date(str); return isNaN(d.getTime())?null:d;
  }

  // =========================
  // CSV parser robusto
  // =========================
  function splitCSVLine(line, sep){
    const out=[]; let cur=''; let inQuotes=false;
    for (let i=0; i<line.length; i++){
      const ch=line[i];
      if (ch==='\"'){
        if (inQuotes && line[i+1]==='\"'){ cur+='\"'; i++; }
        else inQuotes=!inQuotes;
      } else if (ch===sep && !inQuotes){
        out.push(cur); cur='';
      } else {
        cur+=ch;
      }
    }
    out.push(cur);
    return out;
  }

  function parseCSV(csvText) {
    if (!csvText.trim()) return [];
    
    // Remove BOM se presente
    csvText = csvText.replace(/^\uFEFF/, '');
    
    // Detecta separador (prioriza ; depois ,)
    const firstLine = csvText.split(/\r?\n/)[0] || '';
    const sep = firstLine.includes(';') ? ';' : ',';
    
    const lines = csvText.split(/\r?\n/).filter(l => l.trim().length);
    if (lines.length < 2) return [];
    
    // Parse headers
    const headers = splitCSVLine(lines[0], sep).map(h => 
      h.trim().replace(/^"|"$/g, '')
    );
    
    // Parse data rows
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const values = splitCSVLine(lines[i], sep);
      const row = {};
      for (let j = 0; j < headers.length; j++) {
        row[headers[j]] = (values[j] || '').trim().replace(/^"|"$/g, '');
      }
      rows.push(row);
    }
    
    return rows;
  }

  // =========================
  // Estado global
  // =========================
  let csvData = [];
  let filteredData = [];
  let sortState = {};
  let columnMappings = {
    dateColumn: null,
    statusColumn: null,
    collaboratorColumn: null,
    revenueColumn: null,
    qualificationColumn: null
  };

  // =========================
  // Detecção automática de colunas
  // =========================
  function detectColumns(headers) {
    const mappings = { dateColumn: null, statusColumn: null, collaboratorColumn: null, revenueColumn: null, qualificationColumn: null };
    
    for (const header of headers) {
      const norm = normStr(header);
      
      // Data
      if (!mappings.dateColumn && (norm.includes('data') || norm === 'date')) {
        mappings.dateColumn = header;
      }
      
      // Status (prioriza "Status do contrato" para ativo/cancelado)
      if (norm.includes('status') && norm.includes('contrato')) {
        mappings.statusColumn = header;
      } else if (!mappings.statusColumn && norm.includes('status')) {
        mappings.statusColumn = header;
      }
      
      // Colaborador (busca Promotor primeiro, depois Liner, depois Closer)
      if (!mappings.collaboratorColumn) {
        if (norm.includes('promotor') && norm.includes('marketing')) {
          mappings.collaboratorColumn = header;
        } else if (norm.includes('liner')) {
          mappings.collaboratorColumn = header;
        } else if (norm.includes('closer')) {
          mappings.collaboratorColumn = header;
        } else if (norm.includes('colaborador') || norm.includes('consultor') || norm.includes('vendedor')) {
          mappings.collaboratorColumn = header;
        }
      }
      
      // Receita/Valor
      if (!mappings.revenueColumn && (norm.includes('valor') || norm.includes('receita') || norm.includes('venda'))) {
        mappings.revenueColumn = header;
      }
      
      // Qualificação
      if (!mappings.qualificationColumn && (norm.includes('qualificacao') || norm.includes('qualifica'))) {
        mappings.qualificationColumn = header;
      }
    }
    
    return mappings;
  }

  // =========================
  // Função para obter colaborador baseado na dimensão
  // =========================
  function getCollaboratorByDimension(row, dimension) {
    const headers = Object.keys(row);
    
    if (dimension === 'consultor' || dimension === 'todos') {
      // Busca Promotor de marketing primeiro
      const promotor = headers.find(h => normStr(h).includes('promotor') && normStr(h).includes('marketing'));
      if (promotor && row[promotor]) return row[promotor];
      
      // Se não encontrou, usa a coluna mapeada
      return row[columnMappings.collaboratorColumn] || '';
    }
    
    if (dimension === 'liner') {
      const liner = headers.find(h => normStr(h) === 'liner');
      return liner ? row[liner] || '' : '';
    }
    
    if (dimension === 'closer') {
      const closer = headers.find(h => normStr(h) === 'closer');
      return closer ? row[closer] || '' : '';
    }
    
    return '';
  }

  // =========================
  // Função especial para Ranking (ignora dimensão)
  // =========================
  function getFilteredRowsIgnoringDimensao() {
    const busca = normStr(document.getElementById('buscaInput').value);
    const onlyAtivos = document.getElementById('ativosSelect').value === 'sim';
    const dataIni = document.getElementById('dataIni').value ? new Date(document.getElementById('dataIni').value + 'T00:00:00') : null;
    const dataFim = document.getElementById('dataFim').value ? new Date(document.getElementById('dataFim').value + 'T23:59:59') : null;
    
    return csvData.filter(row => {
      // Filtro de período
      if (dataIni || dataFim) {
        const dateValue = row[columnMappings.dateColumn];
        const rowDate = parseDateLoose(dateValue);
        if (!rowDate) return false;
        if (dataIni && rowDate < dataIni) return false;
        if (dataFim && rowDate > dataFim) return false;
      }
      
      // Filtro de ativos
      if (onlyAtivos) {
        const status = normStr(row[columnMappings.statusColumn] || '');
        if (!status.includes('ativo')) return false;
      }
      
      // Filtro de busca (procura em todas as colunas de colaborador)
      if (busca) {
        const headers = Object.keys(row);
        const promotor = headers.find(h => normStr(h).includes('promotor'));
        const liner = headers.find(h => normStr(h) === 'liner');
        const closer = headers.find(h => normStr(h) === 'closer');
        
        const promotorMatch = promotor && normStr(row[promotor]).includes(busca);
        const linerMatch = liner && normStr(row[liner]).includes(busca);
        const closerMatch = closer && normStr(row[closer]).includes(busca);
        
        if (!promotorMatch && !linerMatch && !closerMatch) return false;
      }
      
      return true;
    });
  }

  // =========================
  // Aplicar filtros (usado por outras abas, exceto Ranking)
  // =========================
  function applyFilters() {
    const dimensao = document.getElementById('dimensaoSelect').value;
    const busca = normStr(document.getElementById('buscaInput').value);
    const onlyAtivos = document.getElementById('ativosSelect').value === 'sim';
    const dataIni = document.getElementById('dataIni').value ? new Date(document.getElementById('dataIni').value + 'T00:00:00') : null;
    const dataFim = document.getElementById('dataFim').value ? new Date(document.getElementById('dataFim').value + 'T23:59:59') : null;
    
    filteredData = csvData.filter(row => {
      // Filtro de período
      if (dataIni || dataFim) {
        const dateValue = row[columnMappings.dateColumn];
        const rowDate = parseDateLoose(dateValue);
        if (!rowDate) return false;
        if (dataIni && rowDate < dataIni) return false;
        if (dataFim && rowDate > dataFim) return false;
      }
      
      // Filtro de ativos
      if (onlyAtivos) {
        const status = normStr(row[columnMappings.statusColumn] || '');
        if (!status.includes('ativo')) return false;
      }
      
      // Filtro de colaborador baseado na dimensão
      const collaborator = getCollaboratorByDimension(row, dimensao);
      if (!collaborator.trim()) return false;
      
      // Filtro de busca
      if (busca && !normStr(collaborator).includes(busca)) return false;
      
      return true;
    });
    
    document.getElementById('rowsCount').textContent = filteredData.length;
  }

  // =========================
  // Agregações para Ranking (usando função especial)
  // =========================
  function buildRankingData() {
    const rankingRows = getFilteredRowsIgnoringDimensao(); // ← CORREÇÃO AQUI
    const collaboratorStats = new Map();
    
    // Processa todas as colunas de colaboradores
    rankingRows.forEach(row => {
      const headers = Object.keys(row);
      const promotor = headers.find(h => normStr(h).includes('promotor') && normStr(h).includes('marketing'));
      const liner = headers.find(h => normStr(h) === 'liner');
      const closer = headers.find(h => normStr(h) === 'closer');
      
      const collaborators = [];
      if (promotor && row[promotor]?.trim()) collaborators.push({ name: row[promotor].trim(), role: 'Promotor' });
      if (liner && row[liner]?.trim()) collaborators.push({ name: row[liner].trim(), role: 'Liner' });
      if (closer && row[closer]?.trim()) collaborators.push({ name: row[closer].trim(), role: 'Closer' });
      
      collaborators.forEach(collab => {
        if (!collaboratorStats.has(collab.name)) {
          collaboratorStats.set(collab.name, {
            nome: collab.name,
            aparicoes: 0,
            ativos: 0,
            vgv: 0,
            roles: new Set()
          });
        }
        
        const stats = collaboratorStats.get(collab.name);
        stats.aparicoes += 1;
        stats.roles.add(collab.role);
        
        const isAtivo = normStr(row[columnMappings.statusColumn] || '').includes('ativo');
        if (isAtivo) stats.ativos += 1;
        
        const valor = parseNumberBR(row[columnMappings.revenueColumn] || 0);
        stats.vgv += valor;
      });
    });
    
    return Array.from(collaboratorStats.values()).map(stats => ({
      nome: stats.nome,
      papel: Array.from(stats.roles).join(', '),
      aparicoes: stats.aparicoes,
      ativos: stats.ativos,
      eficiencia: stats.aparicoes > 0 ? (stats.ativos / stats.aparicoes) * 100 : 0,
      vgv: stats.vgv
    }));
  }

  // =========================
  // Renderização
  // =========================
  function renderResumo() {
    const total = filteredData.length;
    const ativos = filteredData.filter(row => {
      const status = normStr(row[columnMappings.statusColumn] || '');
      return status.includes('ativo');
    }).length;
    
    const vgv = filteredData.reduce((sum, row) => {
      return sum + parseNumberBR(row[columnMappings.revenueColumn] || 0);
    }, 0);
    
    const ticketMedio = ativos > 0 ? vgv / ativos : 0;
    const eficienciaGeral = total > 0 ? (ativos / total) * 100 : 0;
    
    const cards = [
      { title: 'Total de registros', value: total.toLocaleString('pt-BR'), subtitle: 'após aplicar filtros' },
      { title: 'Contratos ativos', value: ativos.toLocaleString('pt-BR'), subtitle: `${toPct(eficienciaGeral)} de eficiência` },
      { title: 'VGV Total', value: toBRL(vgv), subtitle: 'valor bruto de vendas' },
      { title: 'Ticket Médio', value: toBRL(ticketMedio), subtitle: 'VGV / contratos ativos' }
    ];
    
    document.getElementById('resumoCards').innerHTML = cards.map(card => `
      <div class="card">
        <h3>${card.title}</h3>
        <div class="big">${card.value}</div>
        <div class="sub">${card.subtitle}</div>
      </div>
    `).join('');
  }

  function renderRanking(sortField = null, sortDir = 'desc') {
    let data = buildRankingData();
    
    if (sortField) {
      data = sortByField(data, sortField, sortDir);
    } else {
      data = sortByField(data, 'vgv', 'desc');
    }
    
    const html = `
      <table>
        <thead>
          <tr>
            <th data-sort="nome">Colaborador</th>
            <th data-sort="papel">Papel(s)</th>
            <th data-sort="aparicoes" class="right">Aparições</th>
            <th data-sort="ativos" class="right">Ativos</th>
            <th data-sort="eficiencia" class="right">Eficiência</th>
            <th data-sort="vgv" class="right">VGV</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(row => `
            <tr>
              <td>${row.nome}</td>
              <td class="muted">${row.papel}</td>
              <td class="right mono">${row.aparicoes.toLocaleString('pt-BR')}</td>
              <td class="right mono">${row.ativos.toLocaleString('pt-BR')}</td>
              <td class="right mono">${toPct(row.eficiencia)}</td>
              <td class="right mono">${toBRL(row.vgv)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    
    document.getElementById('rankingTable').innerHTML = html;
  }

  function renderProfissionais(sortField = null, sortDir = 'desc') {
    const dimensao = document.getElementById('dimensaoSelect').value;
    const collaboratorStats = new Map();
    
    filteredData.forEach(row => {
      const collaborator = getCollaboratorByDimension(row, dimensao);
      if (!collaborator.trim()) return;
      
      if (!collaboratorStats.has(collaborator)) {
        collaboratorStats.set(collaborator, { nome: collaborator, registros: 0, ativos: 0, vgv: 0 });
      }
      
      const stats = collaboratorStats.get(collaborator);
      stats.registros += 1;
      
      const isAtivo = normStr(row[columnMappings.statusColumn] || '').includes('ativo');
      if (isAtivo) stats.ativos += 1;
      
      const valor = parseNumberBR(row[columnMappings.revenueColumn] || 0);
      stats.vgv += valor;
    });
    
    let data = Array.from(collaboratorStats.values()).map(stats => ({
      nome: stats.nome,
      registros: stats.registros,
      ativos: stats.ativos,
      eficiencia: stats.registros > 0 ? (stats.ativos / stats.registros) * 100 : 0,
      vgv: stats.vgv
    }));
    
    if (sortField) {
      data = sortByField(data, sortField, sortDir);
    } else {
      data = sortByField(data, 'nome', 'asc');
    }
    
    const html = `
      <table>
        <thead>
          <tr>
            <th data-sort="nome">Profissional</th>
            <th data-sort="registros" class="right">Registros</th>
            <th data-sort="ativos" class="right">Ativos</th>
            <th data-sort="eficiencia" class="right">Eficiência</th>
            <th data-sort="vgv" class="right">VGV</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(row => {
            const efClass = row.eficiencia >= 25 ? 'good' : row.eficiencia >= 20 ? 'warn' : 'bad';
            return `
              <tr>
                <td>${row.nome}</td>
                <td class="right mono">${row.registros.toLocaleString('pt-BR')}</td>
                <td class="right mono">${row.ativos.toLocaleString('pt-BR')}</td>
                <td class="right mono tag ${efClass}">${toPct(row.eficiencia)}</td>
                <td class="right mono">${toBRL(row.vgv)}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;
    
    document.getElementById('profTable').innerHTML = html;
  }

  function renderRenda(sortField = null, sortDir = 'desc') {
    const headers = csvData.length > 0 ? Object.keys(csvData[0]) : [];
    const rendaColumn = headers.find(h => normStr(h).includes('renda')) || columnMappings.revenueColumn;
    
    if (!rendaColumn) {
      document.getElementById('rendaCards').innerHTML = '<div class="card"><h3>Aviso</h3><div class="big">N/A</div><div class="sub">Coluna de renda não encontrada</div></div>';
      document.getElementById('rendaTable').innerHTML = '<p class="muted">Coluna de renda não disponível nos dados.</p>';
      return;
    }
    
    const faixas = new Map();
    
    filteredData.forEach(row => {
      const rendaValue = parseNumberBR(row[rendaColumn] || 0);
      if (rendaValue <= 0) return;
      
      let faixa;
      if (rendaValue < 12000) faixa = 'Até R$ 11,9k';
      else if (rendaValue < 15000) faixa = 'R$ 12k - R$ 14,9k';
      else if (rendaValue < 20000) faixa = 'R$ 15k - R$ 19,9k';
      else if (rendaValue < 40000) faixa = 'R$ 20k - R$ 39,9k';
      else faixa = 'Acima de R$ 40k';
      
      if (!faixas.has(faixa)) {
        faixas.set(faixa, { faixa, leads: 0, ativos: 0, vgv: 0 });
      }
      
      const stats = faixas.get(faixa);
      stats.leads += 1;
      
      const isAtivo = normStr(row[columnMappings.statusColumn] || '').includes('ativo');
      if (isAtivo) stats.ativos += 1;
      
      const valor = parseNumberBR(row[columnMappings.revenueColumn] || 0);
      stats.vgv += valor;
    });
    
    let data = Array.from(faixas.values()).map(stats => ({
      faixa: stats.faixa,
      leads: stats.leads,
      ativos: stats.ativos,
      conversao: stats.leads > 0 ? (stats.ativos / stats.leads) * 100 : 0,
      vgv: stats.vgv,
      ticket: stats.ativos > 0 ? stats.vgv / stats.ativos : 0
    }));
    
    // Cards
    const totalLeads = data.reduce((sum, item) => sum + item.leads, 0);
    document.getElementById('rendaCards').innerHTML = data.map(item => {
      const percentage = totalLeads > 0 ? (item.leads / totalLeads) * 100 : 0;
      return `
        <div class="card">
          <h3>${item.faixa}</h3>
          <div class="big">${item.leads.toLocaleString('pt-BR')}</div>
          <div class="sub">${percentage.toFixed(1)}% do total • Conv: ${toPct(item.conversao)}</div>
        </div>
      `;
    }).join('');
    
    if (sortField) {
      data = sortByField(data, sortField, sortDir);
    }
    
    const html = `
      <table>
        <thead>
          <tr>
            <th data-sort="faixa">Faixa de Renda</th>
            <th data-sort="leads" class="right">Leads</th>
            <th data-sort="ativos" class="right">Ativos</th>
            <th data-sort="conversao" class="right">Conversão</th>
            <th data-sort="vgv" class="right">VGV</th>
            <th data-sort="ticket" class="right">Ticket</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(row => `
            <tr>
              <td>${row.faixa}</td>
              <td class="right mono">${row.leads.toLocaleString('pt-BR')}</td>
              <td class="right mono">${row.ativos.toLocaleString('pt-BR')}</td>
              <td class="right mono">${toPct(row.conversao)}</td>
              <td class="right mono">${toBRL(row.vgv)}</td>
              <td class="right mono">${toBRL(row.ticket)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    
    document.getElementById('rendaTable').innerHTML = html;
  }

  // =========================
  // Ordenação
  // =========================
  function sortByField(data, field, direction) {
    const multiplier = direction === 'asc' ? 1 : -1;
    
    return [...data].sort((a, b) => {
      let valueA = a[field];
      let valueB = b[field];
      
      // Verifica se são números
      const numA = typeof valueA === 'number' ? valueA : parseNumberBR(valueA);
      const numB = typeof valueB === 'number' ? valueB : parseNumberBR(valueB);
      
      if (typeof valueA === 'number' || typeof valueB === 'number' || 
          (!isNaN(numA) && !isNaN(numB) && field !== 'nome')) {
        return (numA - numB) * multiplier;
      }
      
      // Comparação de strings
      return String(valueA).localeCompare(String(valueB), 'pt-BR', {
        numeric: true,
        sensitivity: 'base'
      }) * multiplier;
    });
  }

  // =========================
  // Controle de tabs e ordenação
  // =========================
  function getActiveTab() {
    return document.querySelector('.tab.active')?.dataset?.tab || 'resumo';
  }

  function renderActiveTab(sortField = null, sortDir = 'desc') {
    const activeTab = getActiveTab();
    
    switch (activeTab) {
      case 'resumo':
        renderResumo();
        break;
      case 'ranking':
        renderRanking(sortField, sortDir);
        break;
      case 'profissionais':
        renderProfissionais(sortField, sortDir);
        break;
      case 'renda':
        renderRenda(sortField, sortDir);
        break;
    }
  }

  // =========================
  // Event Listeners
  // =========================
  
  // Mudança de tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      
      document.querySelectorAll('section[id^="tab-"]').forEach(section => {
        section.classList.add('hide');
      });
      
      const targetTab = document.getElementById(`tab-${tab.dataset.tab}`);
      if (targetTab) {
        targetTab.classList.remove('hide');
      }
      
      renderActiveTab();
    });
  });

  // Ordenação por clique no cabeçalho
  document.addEventListener('click', (e) => {
    const th = e.target.closest('th[data-sort]');
    if (!th) return;
    
    const activeTab = getActiveTab();
    const field = th.dataset.sort;
    const key = `${activeTab}_${field}`;
    const currentSort = sortState[key] || 'desc';
    const newSort = currentSort === 'desc' ? 'asc' : 'desc';
    
    sortState[key] = newSort;
    
    // Atualiza indicadores visuais
    const container = document.querySelector(`#tab-${activeTab}`);
    if (container) {
      container.querySelectorAll('th[data-sort]').forEach(header => {
        header.classList.remove('asc', 'desc');
      });
      th.classList.add(newSort);
    }
    
    renderActiveTab(field, newSort);
  });

  // Aplicar filtros
  document.getElementById('applyBtn').addEventListener('click', () => {
    applyFilters();
    renderActiveTab();
  });

  document.getElementById('applyBtn2').addEventListener('click', () => {
    applyFilters();
    renderActiveTab();
  });

  // Limpar filtros
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('dimensaoSelect').value = 'todos';
    document.getElementById('buscaInput').value = '';
    document.getElementById('ativosSelect').value = 'sim';
    document.getElementById('dataIni').value = '';
    document.getElementById('dataFim').value = '';
    applyFilters();
    renderActiveTab();
  });

  document.getElementById('clearBtn2').addEventListener('click', () => {
    document.getElementById('dimensaoSelect').value = 'todos';
    document.getElementById('buscaInput').value = '';
    document.getElementById('ativosSelect').value = 'sim';
    document.getElementById('dataIni').value = '';
    document.getElementById('dataFim').value = '';
    applyFilters();
    renderActiveTab();
  });

  // Upload de arquivo
  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const data = parseCSV(event.target.result);
        if (data.length === 0) {
          document.getElementById('statusLine').textContent = 'Erro: Arquivo CSV vazio ou inválido';
          return;
        }
        
        csvData = data;
        const headers = Object.keys(data[0]);
        columnMappings = detectColumns(headers);
        
        // Atualiza hints dos campos detectados
        document.getElementById('dateColHint').placeholder = columnMappings.dateColumn || '(não detectado)';
        document.getElementById('statusColHint').placeholder = columnMappings.statusColumn || '(não detectado)';
        document.getElementById('colabColHint').placeholder = columnMappings.collaboratorColumn || '(não detectado)';
        
        applyFilters();
        renderActiveTab();
        
        document.getElementById('statusLine').textContent = `Arquivo carregado: ${data.length} registros`;
      } catch (error) {
        console.error('Erro ao processar CSV:', error);
        document.getElementById('statusLine').textContent = 'Erro ao processar arquivo CSV';
      }
    };
    
    reader.readAsText(file);
  });

  // Recarregar dados
  document.getElementById('reloadBtn').addEventListener('click', async () => {
    try {
      document.getElementById('statusLine').textContent = 'Carregando dados.csv...';
      
      const response = await fetch('./dados.csv', { 
        cache: 'no-cache',
        headers: {
          'Cache-Control': 'no-cache'
        }
      });
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      
      const csvText = await response.text();
      const data = parseCSV(csvText);
      
      if (data.length === 0) {
        throw new Error('CSV vazio ou inválido');
      }
      
      csvData = data;
      const headers = Object.keys(data[0]);
      columnMappings = detectColumns(headers);
      
      // Atualiza hints dos campos detectados
      document.getElementById('dateColHint').placeholder = columnMappings.dateColumn || '(não detectado)';
      document.getElementById('statusColHint').placeholder = columnMappings.statusColumn || '(não detectado)';
      document.getElementById('colabColHint').placeholder = columnMappings.collaboratorColumn || '(não detectado)';
      
      applyFilters();
      renderActiveTab();
      
      document.getElementById('statusLine').textContent = `Dados carregados: ${data.length} registros`;
    } catch (error) {
      console.error('Erro ao carregar CSV:', error);
      document.getElementById('statusLine').textContent = 'Erro: não foi possível carregar ./dados.csv';
    }
  });

  // =========================
  // Inicialização
  // =========================
  document.addEventListener('DOMContentLoaded', () => {
    // Tenta carregar automaticamente
    document.getElementById('reloadBtn').click();
  });
</script>
</body>
</html>
