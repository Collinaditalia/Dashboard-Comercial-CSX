<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard CSV - Funil, Ranking e Análises</title>

  <!-- PapaParse (CSV) -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root{
      --bg0:#0b1220;
      --bg1:#0f172a;
      --card: rgba(255,255,255,.08);
      --card2: rgba(255,255,255,.12);
      --stroke: rgba(255,255,255,.14);
      --stroke2: rgba(255,255,255,.20);
      --txt:#eaf0ff;
      --muted:rgba(234,240,255,.70);
      --primary:#4f8cff;
      --primary2:#2f6bff;
      --success:#22c55e;
      --danger:#ef4444;
      --warn:#f59e0b;
      --shadow: 0 18px 60px rgba(0,0,0,.35);
      --shadow2: 0 10px 30px rgba(0,0,0,.25);
      --r: 16px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--txt);
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(79,140,255,.20), transparent 60%),
        radial-gradient(900px 500px at 80% 20%, rgba(34,197,94,.12), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      padding: 22px;
    }

    .container{max-width:1200px;margin:0 auto}

    .header{
      background: rgba(255,255,255,.06);
      border: 1px solid var(--stroke);
      border-radius: var(--r);
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }
    .header::before{
      content:"";
      position:absolute; inset:-1px;
      background:
        radial-gradient(600px 220px at 15% 0%, rgba(79,140,255,.25), transparent 60%),
        radial-gradient(520px 240px at 85% 5%, rgba(34,197,94,.15), transparent 60%);
      pointer-events:none;
      opacity:.8;
    }
    .header-inner{position:relative;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .title{
      display:flex;gap:14px;align-items:center;
    }
    .logo{
      width:48px;height:48px;border-radius:16px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      box-shadow: 0 12px 30px rgba(79,140,255,.25);
      display:grid;place-items:center;
      border: 1px solid rgba(255,255,255,.18);
      font-size:24px;
    }
    h1{
      font-size: 28px;
      letter-spacing:.2px;
      color: var(--txt);
    }
    .subtitle{
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .upload-wrap{
      width:100%;
      margin-top: 16px;
      position:relative;
    }

    .upload-area{
      border: 1px dashed rgba(79,140,255,.55);
      background: rgba(79,140,255,.08);
      border-radius: 18px;
      padding: 20px;
      cursor: pointer;
      transition: .2s ease;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 16px;
    }
    .upload-area:hover{transform: translateY(-2px); background: rgba(79,140,255,.12); border-color: rgba(79,140,255,.70)}
    .upload-left{
      display:flex;align-items:center;gap:14px;min-width: 280px;
    }
    .upload-icon{
      width:44px;height:44px;border-radius:16px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.15);
      display:grid;place-items:center;
      font-size:20px;
    }
    .upload-text strong{display:block;color:var(--txt)}
    .upload-text small{color: var(--muted)}
    .upload-right{
      display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end;
    }
    .pill{
      font-size:13px;
      color: var(--muted);
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,.20);
      padding: 8px 14px;
      border-radius: 999px;
      max-width: 300px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

      border
