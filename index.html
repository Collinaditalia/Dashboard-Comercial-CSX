<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Vendas</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 0; }
    .container { max-width: 900px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px #0001; }
    .kpi-card { display:inline-block; margin-right:18px; background:#eee; border-radius:6px; padding:12px 16px; margin-bottom:12px; min-width:170px;}
    .c-purple { background: #b77cff22; }
    .c-green { background: #7cffb722; }
    .c-yellow { background: #ffe67c22; }
    .kpi-label { font-size:1.1rem; color: #666;}
    .kpi-value { font-size:1.7rem; font-weight: bold; }
    .kpi-sub { font-size:0.89rem; color: #888;}
    .insight-card { display:block; border-radius:6px; margin-bottom:12px; padding:10px 16px;}
    .ig { background: #c7f2fd; }
    .ip { background: #d1ffd1; }
    .ir { background: #ffe1e1; }
    .iy { background: #fff6d1; }
    .insight-type {font-weight: bold; font-size:1.04rem; margin-bottom:4px;}
    .insight-text {font-size:1.04rem;}
    h1 { font-weight: normal; text-align: center; color:#6247aa;}
    .meta-field { margin-bottom:10px;}
    .meta-field label { font-size:0.97rem; color: #444;}
    input[type="text"] { border-radius:4px; border:1px solid #aaa; padding:3px 6px; font-size:1rem;}
    .mes-card { border:1px solid #ccc; border-radius:8px; margin-bottom:16px; background:#fafbfd;}
    .mes-card-body {padding:16px 22px;}
    .mes-card h3 {margin:0; font-size:1.21rem; color: #5c469c;}
    table { width:100%; border-collapse:collapse;}
    th, td { padding:7px 10px;}
    th { background:#eee; }
    tr:nth-child(even) { background: #f1f1f1;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Dashboard de Vendas</h1>
    <div id="kpi-geral"></div>
    <h2>Insights</h2>
    <div id="insights-box"></div>
    <h2>Resumo Mensal / Metas</h2>
    <div id="metas-box"></div>
  </div>
  <script>
    // Exemplo de dados fictícios
    const dados = [
      { status: 'ATIVO', promotor: 'Maria', closer: 'João', valor: 120000, renda: 4000 },
      { status: 'CANCELADO', promotor: 'Maria', closer: 'Lucas', valor: 110000, renda: 3900 },
      { status: 'ATIVO', promotor: 'Carlos', closer: 'João', valor: 125000, renda: 4200 },
      { status: 'CANCELADO', promotor: 'Amanda', closer: 'Lucas', valor: 99000, renda: 3500 },
      { status: 'ATIVO', promotor: 'Maria', closer: 'João', valor: 132000, renda: 4500 },
    ];

    // Função ajustada para parseContrato (soma ATIVO + CANCELADO)
    function parseContrato(s){
      if(!s) return {vendas:0, cancelados:0, total:0};
      const u = String(s).toUpperCase();
      const ativos = (u.match(/ATIVO/g) || []).length;
      const cancelados = (u.match(/CANCELADO/g) || []).length;
      return {vendas: ativos, cancelados, total: ativos + cancelados};
    }

    function renderKPIGeral() {
      const vendas = dados.filter(d=>['ATIVO','CANCELADO'].includes(d.status.toUpperCase())).length;
      const cancelados = dados.filter(d=>d.status.toUpperCase()==='CANCELADO').length;
      const vgvTotal = dados.reduce((s,d)=>s+(parseFloat(d.valor)||0),0);
      document.getElementById('kpi-geral').innerHTML=`
        <div class="kpi-card c-purple"><div class="kpi-label">Total Atendimentos</div><div class="kpi-value">${dados.length}</div><div class="kpi-sub">no filtro</div></div>
        <div class="kpi-card c-green"><div class="kpi-label">Vendas (Total)</div><div class="kpi-value">${vendas}</div><div class="kpi-sub">contratos ativos + cancelados</div></div>
        <div class="kpi-card c-yellow"><div class="kpi-label">VGV Total</div><div class="kpi-value" style="font-size:1.15rem">R$$
{(vgvTotal/1000).toFixed(0)}k</div><div class="kpi-sub">${vgvTotal.toLocaleString('pt-BR')}</div></div> `; } function renderInsights() { // Promotor com mais atendimentos const promoCont = {}; dados.forEach(d => { promoCont[d.promotor] = (promoCont[d.promotor]||0)+1; }); const topPromo = Object.entries(promoCont).sort((a,b)=>b[1]-a[1])[0]; // Closer com mais vendas const closerCont = {}; dados.forEach(d=>{ if(['ATIVO','CANCELADO'].includes(d.status.toUpperCase())) closerCont[d.closer] = (closerCont[d.closer]||0)+1; }); const topCloser = Object.entries(closerCont).sort((a,b)=>b[1]-a[1])[0]; const vendas = dados.filter(d=>['ATIVO','CANCELADO'].includes(d.status.toUpperCase())).length; const cancelados = dados.filter(d=>d.status.toUpperCase()==='CANCELADO').length; const pcCancel = vendas? ((cancelados/vendas)*100).toFixed(1) : '0'; const rendaMedia = vendas ? (dados.reduce((s,d)=>s+(parseFloat(d.renda)||0),0)/vendas) : 0; // Exemplo fictício para pctNotour e notour const notour = 2, pctNotour = ((notour/dados.length)*100).toFixed(1); document.getElementById('insights-box').innerHTML=` <div class="insight-card ig"><div class="insight-type">✅ Promotor Destaque</div><div class="insight-text">Mais atendimentos: <strong>${topPromo?topPromo[0]:'—'}</strong> (${topPromo?topPromo[1]:0} casais)</div></div> <div class="insight-card ig"><div class="insight-type">🏆 Closer Destaque</div><div class="insight-text">Mais vendas: <strong>${topCloser?topCloser[0]:'—'}</strong> (${topCloser?topCloser[1]:0} vendas)</div></div> <div class="insight-card ${(parseFloat(pcCancel)>30?'ir':'iy')}"><div class="insight-type">⚠️ Cancelamentos</div><div class="insight-text">Taxa: <strong>${pcCancel}%</strong> — ${cancelados} de ${vendas} vendas canceladas</div></div> <div class="insight-card ip"><div class="insight-type">💰 Renda Média</div><div class="insight-text">Média geral: <strong>R
$${Math.round(rendaMedia).toLocaleString('pt-BR')}</strong></div></div>
        <div class="insight-card ${(parseFloat(pctNotour)>15?'ir':'iy')}"><div class="insight-type">📊 NoTour</div><div class="insight-text"><strong>${pctNotour}%</strong> saíram sem tour (${notour} casos)</div></div>
      `;
    }

    function barPct(pct){
      const val = Math.min(100,Math.round(pct));
      return `<span style="display:inline-block;width:56px;height:8px;border-radius:4px;overflow:hidden;background:#eee;margin:0 8px 0 0;vertical-align:middle;">
        <span style="background:#4fa0ff;display:block;height:100%;width:${val}%;"></span>
      </span>`;
    }

    function renderMetas(){
      // Exemplo de metas e resumo
      const meses = ['06/2026','05/2026','04/2026'];
      const metas = {
        '06/2026': { vgv:300000, casais:8, cotas:3 },
        '05/2026': { vgv:400000, casais:12, cotas:4 },
        '04/2026': { vgv:250000, casais:10, cotas:2 },
      };
      const real = {
        '06/2026': { vgv:367000, casais:8, vendas:3 },
        '05/2026': { vgv:153000, casais:3, vendas:1 },
        '04/2026': { vgv:40000, casais:1, vendas:0 }
      };
      let html = '';
      meses.forEach(mes => {
        const mt = metas[mes]||{}, r = real[mes]||{};
        const pctVGV = mt.vgv ? Math.round((r.vgv/mt.vgv)*100) : null;
        const pctCasais = mt.casais ? Math.round((r.casais/mt.casais)*100) : null;
        const pctCotas = mt.cotas ? Math.round((r.vendas/mt.cotas)*100) : null;
        html += `
          <div class="mes-card">
            <div class="mes-card-body">
              <h3>${mes}</h3>
              <div class="meta-field"><label>🏆 Meta VGV (R$)</label>
                <input type="text" id="meta-vgv-${mes}" value="${mt.vgv||''}" placeholder="Ex: 500000">
                ${barPct(pctVGV)}${pctVGV?`<span style="font-size:0.65rem;color:var(--text2)">${pctVGV}% · R$$
{r.vgv.toLocaleString('pt-BR')} realizado</span>`:''} </div> <div class="meta-field"><label>👫 Meta Casais em Sala</label> <input type="text" id="meta-casais-${mes}" value="${mt.casais||''}" placeholder="Ex: 40"> ${barPct(pctCasais)}${pctCasais?`<span style="font-size:0.65rem;color:var(--text2)">${pctCasais}% \cdot  ${r.casais} realizados</span>`:''} </div> <div class="meta-field"><label>📋 Meta Nº de Cotas</label> <input type="text" id="meta-cotas-${mes}" value="${mt.cotas||''}" placeholder="Ex: 8"> ${barPct(pctCotas)}${pctCotas?`<span style="font-size:0.65rem;color:var(--text2)">${pctCotas}% \cdot  ${r.vendas} cotas realizadas</span>`:''} </div> </div> </div> `; }); // Resumo (tabela) html += ` <h3>Resumo das Metas</h3> <table> <tr><th>Mês</th><th>Meta Vendas</th><th>Realizado</th><th>Meta VGV</th><th>Realizado</th></tr> ${meses.map(mes=>{ const mt = metas[mes]||{}, r = real[mes]||{}; return `<tr> <td>${mes}</td> <td>${mt.cotas||''}</td> <td>${r.vendas||0}</td> <td>R
$${(mt.vgv||0).toLocaleString('pt-BR')}</td>
            <td>R$${(r.vgv||0).toLocaleString('pt-BR')}</td>
          </tr>`;
        }).join('')}
      </table>
      `;
      document.getElementById('metas-box').innerHTML = html;
    }

    // Chama ao carregar:
    renderKPIGeral();
    renderInsights();
    renderMetas();
  </script>
</body>
</html>
