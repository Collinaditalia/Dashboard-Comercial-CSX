<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Painel de Atendimentos</title>
  <meta name="color-scheme" content="dark light" />
  <style>
    :root{
      --bg0:#070A12;
      --bg1:#0B1222;
      --card: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.12);
      --text:#EAF0FF;
      --muted: rgba(234,240,255,.72);
      --good:#5CFFB0;
      --warn:#FFDF6C;
      --bad:#FF6B8B;
      --accent:#7C5CFF;
      --accent2:#22D3EE;
      --shadow: 0 20px 60px rgba(0,0,0,.55);
      --radius: 18px;
      --radius2: 12px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 10% 10%, rgba(124,92,255,.25), transparent 55%),
        radial-gradient(900px 600px at 90% 20%, rgba(34,211,238,.18), transparent 55%),
        radial-gradient(800px 600px at 40% 90%, rgba(92,255,176,.12), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
    }
    a{color:inherit}
    .wrap{max-width:1200px; margin:0 auto; padding:28px 16px 60px}
    header{
      display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
      padding:18px 18px;
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    h1{margin:0; font-size:20px; letter-spacing:.2px}
    .sub{margin:6px 0 0; color:var(--muted); font-size:13px}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 10px;
      border-radius: 999px;
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.18);
      font-family: var(--mono);
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:14px;
      margin-top:14px;
    }
    .card{
      grid-column: span 12;
      padding:16px;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .kpis{display:grid; grid-template-columns: repeat(12, 1fr); gap:12px}
    .kpi{
      grid-column: span 6;
      padding:14px;
      border-radius: var(--radius2);
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.15);
      min-height:84px;
    }
    @media (min-width: 900px){
      .kpi{grid-column: span 3;}
      .filters .row{grid-template-columns: repeat(6, 1fr);}
    }
    .kpi .label{font-size:12px; color:var(--muted)}
    .kpi .value{margin-top:8px; font-size:20px; font-weight:700; letter-spacing:.2px}
    .kpi .hint{margin-top:6px; font-size:12px; color:var(--muted)}
    .filters .row{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:10px;
      align-items:end;
    }
    label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
    select, input{
      width:100%;
      padding:10px 10px;
      border-radius: 12px;
      border:1px solid var(--stroke);
      background: rgba(10,12,20,.55);
      color: var(--text);
      outline:none;
    }
    input::placeholder{color: rgba(234,240,255,.42)}
    .btns{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
    button{
      padding:10px 12px;
      border-radius: 12px;
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(124,92,255,.25), rgba(124,92,255,.10));
      color: var(--text);
      cursor:pointer;
    }
    button.secondary{
      background: rgba(0,0,0,.18);
    }
    .tableWrap{overflow:auto; border-radius: var(--radius); border:1px solid var(--stroke)}
    table{width:100%; border-collapse:collapse; min-width:980px; background: rgba(0,0,0,.10)}
    th,td{padding:10px 10px; border-bottom:1px solid rgba(255,255,255,.07); vertical-align:top}
    th{
      position:sticky; top:0;
      background: rgba(10,12,20,.9);
      backdrop-filter: blur(10px);
      text-align:left;
      font-size:12px;
      color: var(--muted);
      font-weight:600;
      z-index:1;
    }
    td{font-size:13px}
    .tag{
      display:inline-flex; align-items:center;
      padding:3px 8px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      font-size:12px;
      white-space:nowrap;
    }
    .tag.good{border-color: rgba(92,255,176,.35); color: rgba(92,255,176,.95)}
    .tag.warn{border-color: rgba(255,223,108,.35); color: rgba(255,223,108,.95)}
    .tag.bad{border-color: rgba(255,107,139,.35); color: rgba(255,107,139,.95)}
    .small{font-size:12px; color:var(--muted)}
    .err{
      margin-top:12px;
      padding:12px 14px;
      border-radius: 14px;
      border:1px solid rgba(255,107,139,.35);
      background: rgba(255,107,139,.10);
      color: rgba(255,220,230,.95);
      display:none;
      white-space:pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Painel de Atendimentos (CSV)</h1>
        <div class="sub">Leitura de <span class="pill" id="csvPath">dados.csv</span> via GitHub Pages (sem backend).</div>
      </div>
      <div class="pill" id="statusPill">Carregando…</div>
    </header>

    <div class="grid">
      <section class="card">
        <div class="kpis" id="kpis"></div>
      </section>

      <section class="card filters">
        <div class="row">
          <div>
            <label>Período (início)</label>
            <input id="dtIni" placeholder="dd/mm/aaaa" />
          </div>
          <div>
            <label>Período (fim)</label>
            <input id="dtFim" placeholder="dd/mm/aaaa" />
          </div>
          <div>
            <label>Status atendimento</label>
            <select id="fStatus"></select>
          </div>
          <div>
            <label>UF</label>
            <select id="fUF"></select>
          </div>
          <div>
            <label>Cidade</label>
            <select id="fCidade"></select>
          </div>
          <div>
            <label>Promotor de marketing</label>
            <select id="fPromotor"></select>
          </div>
        </div>

        <div class="btns">
          <button id="btnAplicar">Aplicar filtros</button>
          <button class="secondary" id="btnLimpar">Limpar</button>
        </div>

        <div class="err" id="errBox"></div>
      </section>

      <section class="card">
        <div class="small" id="countLine"></div>
        <div style="height:10px"></div>
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th>Status</th>
                <th>UF</th>
                <th>Cidade</th>
                <th>Promotor</th>
                <th>Liner</th>
                <th>Closer</th>
                <th>Valor vendido</th>
                <th>Local captação</th>
                <th>Contrato</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

<script>
  const CSV_URL = "./dados.csv";

  const el = (id) => document.getElementById(id);

  const state = {
    rows: [],
    filtered: []
  };

  function showError(msg){
    const box = el("errBox");
    box.style.display = "block";
    box.textContent = msg;
  }
  function clearError(){
    const box = el("errBox");
    box.style.display = "none";
    box.textContent = "";
  }

  function stripBOM(s){
    if (!s) return s;
    return s.replace(/^\uFEFF/, "");
  }

  function normalizeHeader(h){
    return stripBOM(String(h ?? ""))
      .trim()
      .toLowerCase();
  }

  function parseBRDate(str){
    if (!str) return null;
    const s = String(str).trim();
    const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return null;
    const d = Number(m[1]), mo = Number(m[2]) - 1, y = Number(m[3]);
    const dt = new Date(y, mo, d);
    // validação simples
    if (dt.getFullYear() !== y || dt.getMonth() !== mo || dt.getDate() !== d) return null;
    return dt;
  }

  function parseMoneyBR(value){
    if (value == null) return 0;
    let s = String(value).trim();
    if (!s) return 0;

    // remove "R$" e espaços
    s = s.replace(/\s/g, "").replace(/^R\$/i, "");

    // se vier "20.000,00" -> 20000.00
    // se vier "87000" -> 87000
    if (s.includes(",")) {
      s = s.replace(/\./g, "").replace(",", ".");
    } else {
      // se tiver ponto como milhar, remove
      s = s.replace(/\./g, "");
    }

    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  }

  function formatMoneyBR(n){
    return (n || 0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
  }

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // CSV simples (seu arquivo usa ';' e pode ter campos com aspas)
  function parseCSV(text, delimiter=";"){
    const rows = [];
    let i = 0, field = "", row = [], inQuotes = false;

    while (i < text.length){
      const c = text[i];

      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      } else {
        if (c === '"'){ inQuotes = true; i++; continue; }
        if (c === delimiter){
          row.push(field); field = ""; i++; continue;
        }
        if (c === "\n"){
          row.push(field); rows.push(row);
          row = []; field = ""; i++; continue;
        }
        if (c === "\r"){ i++; continue; }
        field += c; i++; continue;
      }
    }
    // último campo
    row.push(field);
    // evita linha vazia final
    if (row.length > 1 || (row.length === 1 && row[0].trim() !== "")) rows.push(row);
    return rows;
  }

  function buildObjects(csvText){
    const matrix = parseCSV(csvText, ";");
    if (!matrix.length) return [];

    const headersRaw = matrix[0];
    const headers = headersRaw.map(normalizeHeader);

    const idx = (name) => headers.indexOf(name);

    const iData = idx("data"); // importante: trata BOM via normalizeHeader
    if (iData === -1){
      throw new Error(`Cabeçalho "data" não encontrado. Cabeçalhos lidos: ${headersRaw.join(" | ")}`);
    }

    const rows = [];
    for (let r = 1; r < matrix.length; r++){
      const line = matrix[r];
      // cria map por header
      const obj = {};
      for (let c = 0; c < headers.length; c++){
        const key = headers[c] || `col_${c}`;
        obj[key] = (line[c] ?? "").trim();
      }

      const dt = parseBRDate(obj["data"]);
      obj._date = dt;

      obj._valor = parseMoneyBR(obj["valor vendido"]);
      rows.push(obj);
    }
    return rows;
  }

  function uniqSorted(arr){
    return Array.from(new Set(arr.filter(v => v != null && String(v).trim() !== "").map(v => String(v).trim())))
      .sort((a,b) => a.localeCompare(b, "pt-BR", { sensitivity:"base" }));
  }

  function fillSelect(selectEl, values, placeholder="(Todos)"){
    selectEl.innerHTML = "";
    const opt0 = document.createElement("option");
    opt0.value = "";
    opt0.textContent = placeholder;
    selectEl.appendChild(opt0);

    for (const v of values){
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      selectEl.appendChild(opt);
    }
  }

  function tagForStatus(s){
    const v = String(s || "").toLowerCase();
    if (v.includes("encerr")) return "good";
    if (v.includes("ativo")) return "warn";
    if (v.includes("cancel")) return "bad";
    if (v.includes("notour")) return "warn";
    return "";
  }

  function applyFilters(){
    clearError();

    const fStatus = el("fStatus").value.trim();
    const fUF = el("fUF").value.trim();
    const fCidade = el("fCidade").value.trim();
    const fPromotor = el("fPromotor").value.trim();

    const ini = parseBRDate(el("dtIni").value.trim());
    const fim = parseBRDate(el("dtFim").value.trim());

    const out = state.rows.filter(o => {
      if (fStatus && o["status atendimento"] !== fStatus) return false;
      if (fUF && o["uf"] !== fUF) return false;
      if (fCidade && o["cidade"] !== fCidade) return false;
      if (fPromotor && o["promotor de marketing"] !== fPromotor) return false;

      if (ini && (!o._date || o._date < ini)) return false;
      if (fim && (!o._date || o._date > fim)) return false;

      return true;
    });

    state.filtered = out;
    renderAll();
  }

  function renderKPIs(){
    const rows = state.filtered;

    const total = rows.length;
    const soma = rows.reduce((acc, o) => acc + (o._valor || 0), 0);
    const encerrado = rows.filter(o => String(o["status atendimento"]).toLowerCase().includes("encerr")).length;
    const cancelado = rows.filter(o => String(o["status do contrato"]).toLowerCase().includes("cancel")).length;

    const kpis = [
      { label: "Registros (filtrados)", value: total.toLocaleString("pt-BR"), hint: "Linhas do CSV após filtros" },
      { label: "Valor vendido (soma)", value: formatMoneyBR(soma), hint: "Campo: Valor vendido" },
      { label: "Atendimentos encerrados", value: encerrado.toLocaleString("pt-BR"), hint: "Status atendimento contém 'Encerr'" },
      { label: "Contratos cancelados", value: cancelado.toLocaleString("pt-BR"), hint: "Status do contrato contém 'Cancel'" },
    ];

    el("kpis").innerHTML = kpis.map(k => `
      <div class="kpi">
        <div class="label">${escapeHtml(k.label)}</div>
        <div class="value">${escapeHtml(k.value)}</div>
        <div class="hint">${escapeHtml(k.hint)}</div>
      </div>
    `).join("");
  }

  function renderTable(){
    const rows = state.filtered;

    el("countLine").textContent = `${rows.length.toLocaleString("pt-BR")} registros exibidos.`;

    const tbody = el("tbody");
    tbody.innerHTML = rows.slice(0, 2000).map(o => {
      const st = o["status atendimento"];
      const cl = tagForStatus(st);
      const contrato = o["status do contrato"];

      return `
        <tr>
          <td>${escapeHtml(o["data"] || "")}</td>
          <td><span class="tag ${cl}">${escapeHtml(st || "")}</span></td>
          <td>${escapeHtml(o["uf"] || "")}</td>
          <td>${escapeHtml(o["cidade"] || "")}</td>
          <td>${escapeHtml(o["promotor de marketing"] || "")}</td>
          <td>${escapeHtml(o["liner"] || "")}</td>
          <td>${escapeHtml(o["closer"] || "")}</td>
          <td>${escapeHtml(formatMoneyBR(o._valor || 0))}</td>
          <td>${escapeHtml(o["local captação"] || "")}</td>
          <td>${escapeHtml(contrato || "")}</td>
        </tr>
      `;
    }).join("");
  }

  function renderAll(){
    renderKPIs();
    renderTable();
    el("statusPill").textContent = `OK • ${state.filtered.length.toLocaleString("pt-BR")} linhas`;
  }

  async function init(){
    el("csvPath").textContent = CSV_URL;

    try{
      el("statusPill").textContent = "Baixando CSV…";
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if (!res.ok){
        throw new Error(`Falha ao carregar ${CSV_URL} (HTTP ${res.status}). Confirme se o arquivo está na raiz do repo e o GitHub Pages está ativo.`);
      }
      const text = await res.text();

      el("statusPill").textContent = "Processando…";
      const rows = buildObjects(text);

      state.rows = rows;
      state.filtered = rows;

      // preenche filtros
      fillSelect(el("fStatus"), uniqSorted(rows.map(o => o["status atendimento"])));
      fillSelect(el("fUF"), uniqSorted(rows.map(o => o["uf"])));
      fillSelect(el("fCidade"), uniqSorted(rows.map(o => o["cidade"])));
      fillSelect(el("fPromotor"), uniqSorted(rows.map(o => o["promotor de marketing"])));

      // período sugerido (min/max)
      const dates = rows.map(o => o._date).filter(Boolean).sort((a,b)=>a-b);
      if (dates.length){
        const pad = (n)=> String(n).padStart(2,"0");
        const fmt = (d)=> `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
        el("dtIni").value = fmt(dates[0]);
        el("dtFim").value = fmt(dates[dates.length-1]);
      }

      renderAll();
    }catch(err){
      el("statusPill").textContent = "Erro";
      showError(String(err && err.message ? err.message : err));
    }
  }

  el("btnAplicar").addEventListener("click", applyFilters);
  el("btnLimpar").addEventListener("click", () => {
    el("dtIni").value = "";
    el("dtFim").value = "";
    el("fStatus").value = "";
    el("fUF").value = "";
    el("fCidade").value = "";
    el("fPromotor").value = "";
    state.filtered = state.rows;
    renderAll();
  });

  init();
</script>
</body>
</html>
