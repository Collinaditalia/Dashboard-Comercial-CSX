<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard – Controle de Sala (Jan → Jun / 2026)</title>

    <!-- ==== Fonte ==== -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- ==== Ícones (Font Awesome – substitua sua key se precisar) ==== -->
    <script src="https://kit.fontawesome.com/yourkit.js" crossorigin="anonymous"></script>

    <!-- ==== Bibliotecas ==== -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

    <!-- ==== Bootstrap (layout responsivo) ==== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* ---------- Cores e tipografia da identidade ---------- */
        :root{
            --primary:#2e7d32;          /* verde‑escuro – títulos */
            --secondary:#66bb6a;        /* verde‑claro – cards */
            --bg:#f5f5f5;               /* fundo neutro */
            --card-bg:#ffffff;          /* fundo dos cards */
            --accent:#ffdd55;           /* amarelo‑dourado – destaques */
        }
        body{
            font-family:'Nunito',sans-serif;
            background:var(--bg);
            color:var(--primary);
        }
        .header{
            background:var(--primary);
            color:#fff;
            padding:1.5rem 0;
            text-align:center;
        }
        .header h1{margin:0;font-size:2rem;}
        .card{
            background:var(--card-bg);
            border-radius:12px;
            box-shadow:0 4px 12px rgba(0,0,0,.1);
            transition:transform .2s,box-shadow .2s;
        }
        .card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.15);}
        .card-header{
            background:var(--secondary);
            color:#fff;
            padding:.75rem 1rem;
            border-radius:12px 12px 0 0;
            font-weight:600;
        }
        .badge-status{
            font-size:.75rem;
            padding:.25rem .5rem;
            border-radius:8px;
        }
        .badge-encerrado{background:#e0e0e0;color:#424242;}
        .badge-notour{background:#ffcc80;color:#bf360c;}
        .badge-liner{background:#90caf9;color:#0d47a1;}
        .table th{background:var(--secondary);color:#fff;}
        .table td,.table th{vertical-align:middle;}
        .grid-gap{gap:1.5rem;}
    </style>
</head>

<body>
    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <h1>📈 Controle de Sala – Jan → Jun / 2026</h1>
    </header>

    <main class="container-fluid my-4">

        <!-- ==================== KPI ROW ==================== -->
        <section class="row grid-gap">
            <div class="col-md-3">
                <div class="card text-center p-3">
                    <div class="h4"><i class="fas fa-list"></i></div>
                    <div id="kpi-total" class="display-5 fw-bold">0</div>
                    <div class="text-muted">Atendimentos</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center p-3">
                    <div class="h4"><i class="fas fa-dollar-sign"></i></div>
                    <div id="kpi-valor" class="display-5 fw-bold">R$ 0,00</div>
                    <div class="text-muted">Valor vendido</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center p-3">
                    <div class="h4"><i class="fas fa-check-circle"></i></div>
                    <div id="kpi-ativo" class="display-5 fw-bold">0 %</div>
                    <div class="text-muted">Contratos ativos</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center p-3">
                    <div class="h4"><i class="fas fa-gift"></i></div>
                    <div id="kpi-brindes" class="display-5 fw-bold">0</div>
                    <div class="text-muted">Brindes entregues</div>
                </div>
            </div>
        </section>

        <!-- ==================== GRÁFICOS ==================== -->
        <section class="row grid-gap mt-4">
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header">Valor vendido por mês</div>
                    <div class="card-body"><div id="grafico-valor-mes" style="height:350px;"></div></div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card h-100">
                    <div class="card-header">Distribuição de status</div>
                    <div class="card-body"><div id="grafico-status" style="height:350px;"></div></div>
                </div>
            </div>
        </section>

        <!-- ==================== TABELA DETALHADA ==================== -->
        <section class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">Atendimentos – Detalhes</div>
                    <div class="card-body">
                        <table id="tabela-detalhes" class="table table-hover table-sm">
                            <thead class="table-light">
                                <tr>
                                    <th>Data</th>
                                    <th>Status</th>
                                    <th>Nome 1</th>
                                    <th>Nome 2</th>
                                    <th>Promotor</th>
                                    <th>Valor vendido</th>
                                    <th>Local Captação</th>
                                    <th>UF</th>
                                    <th>Cidade</th>
                                    <th>Brindes efetivos</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- ==================== SCRIPT DE LEITURA & VISUALIZAÇÃO ==================== -->
    <script>
        /* -------------------------------------------------
           CONFIGURAÇÕES
        ------------------------------------------------- */
        const CSV_PATH = 'controle_sala.csv';   // <- caminho relativo ao HTML

        /* -------------------------------------------------
           FUNÇÕES AUXILIARES
        ------------------------------------------------- */
        const fmtBRL = n => n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
        const badge = status => ({
            'Encerrado' : `<span class="badge badge-status badge-encerrado">Encerrado</span>`,
            'NoTour'   : `<span class="badge badge-status badge-notour">NoTour</span>`,
            'Liner'    : `<span class="badge badge-status badge-liner">Liner</span>`
        })[status] || status;

        /* -------------------------------------------------
           LEITURA DO CSV
        ------------------------------------------------- */
        Papa.parse(CSV_PATH,{
            download:true,
            header:true,
            skipEmptyLines:true,
            complete: ({data}) => {
                gerarKPIs(data);
                gerarGraficos(data);
                preencherTabela(data);
            },
            error: err => console.error('Erro ao ler CSV:',err)
        });

        /* -------------------------------------------------
           KPI
        ------------------------------------------------- */
        function gerarKPIs(rows){
            const totalAt = rows.length;
            const totalValor = rows.reduce((s,r)=>s+parseFloat(r['Valor vendido'].replace(/[^\d.-]/g,''))||0,0);
            const ativos = rows.filter(r=> (r['Status do contrato']||'').trim().toUpperCase()==='ATIVO').length;
            const brinde = rows.reduce((s,r)=>{
                const txt = r['Brindes efetivos']||'';
                const m = txt.match(/TOTAL:\s*(\d+)/i);
                return s + (m?parseInt(m[1]):0);
            },0);

            document.getElementById('kpi-total').textContent   = totalAt;
            document.getElementById('kpi-valor').textContent   = fmtBRL(totalValor);
            document.getElementById('kpi-ativo').textContent   = ((ativos/totalAt)*100).toFixed(1)+'%';
            document.getElementById('kpi-brindes').textContent = brinde;
        }

        /* -------------------------------------------------
           GRÁFICOS
        ------------------------------------------------- */
        function gerarGraficos(rows){
            /* ---- Valor vendido por mês ---- */
            const porMes = {};
            rows.forEach(r=>{
                const d = r['Data de atendimento'];
                if(!d) return;
                const mes = d.split('/')[0];               // mês numérico (ex.: "1" para Janeiro)
                const valor = parseFloat(r['Valor vendido'].replace(/[^\d.-]/g,''))||0;
                porMes[mes] = (porMes[mes]||0)+valor;
            });
            const mesesOrd = Object.keys(porMes).sort((a,b)=>a-b);
            const valores = mesesOrd.map(m=>porMes[m]);

            Plotly.newPlot('grafico-valor-mes',[{
                x: mesesOrd,
                y: valores,
                type:'bar',
                marker:{color:'var(--secondary)'}
            }],{
                title:{text:'Valor vendido por mês',font:{color:'var(--primary)'}},
                xaxis:{title:'Mês'},
                yaxis:{title:'Valor (R$)',tickformat:',.0f'},
                margin:{l:50,r:30,b:50,t:50},
